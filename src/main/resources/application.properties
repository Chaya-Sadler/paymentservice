spring.application.name=paymentservice
server.port=8086

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=cs_pays_ms
spring.datasource.password=training
spring.datasource.url=jdbc:postgres://localhost:5432/cs_pays_ms

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-server=localhost:9092
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.key-deserialization=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserialization=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE
spring.kafka.consumer.enable-auto.commit=false

spring.kafka.topic=payment.events

# ALWAYS_SUCCESS | ALWAYS_FAIL | RANDOM
payment.simulate.mode= ALWAYS_SUCCESS
